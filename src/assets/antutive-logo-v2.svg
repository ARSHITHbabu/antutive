<svg width="512" height="512" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#64B5F6"/>
      <stop offset="55%"  stop-color="#90CAF9"/>
      <stop offset="100%" stop-color="#CE93D8"/>
    </linearGradient>
  </defs>

  <!-- Lightbulb orb -->
  <circle cx="24" cy="9" r="4" fill="url(#g)" opacity="0.88"/>
  <!-- Rays -->
  <line x1="24"   y1="3.5" x2="24"   y2="2"   stroke="url(#g)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="29"   y1="5.2" x2="30.2" y2="4"   stroke="url(#g)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="19"   y1="5.2" x2="17.8" y2="4"   stroke="url(#g)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="31.5" y1="9"   x2="33"   y2="9"   stroke="url(#g)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="16.5" y1="9"   x2="15"   y2="9"   stroke="url(#g)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Stem -->
  <line x1="24" y1="13" x2="24" y2="15" stroke="url(#g)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Face circle -->
  <circle cx="24" cy="26" r="11" fill="none" stroke="url(#g)" stroke-width="1.8"/>

  <!-- A letterform -->
  <line x1="24"   y1="18"   x2="18"   y2="33"   stroke="url(#g)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="24"   y1="18"   x2="30"   y2="33"   stroke="url(#g)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="20.2" y1="27.5" x2="27.8" y2="27.5" stroke="url(#g)" stroke-width="2"   stroke-linecap="round"/>
  <circle cx="24"   cy="18"   r="1.6" fill="url(#g)"/>
  <circle cx="20.2" cy="27.5" r="1"   fill="url(#g)" opacity="0.8"/>
  <circle cx="27.8" cy="27.5" r="1"   fill="url(#g)" opacity="0.8"/>

  <!-- Brain hemispheres — left -->
  <path d="M 13 22 A 3 3 0 0 0 13 26 A 3 3 0 0 0 13 30" fill="none" stroke="url(#g)" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Brain hemispheres — right -->
  <path d="M 35 22 A 3 3 0 0 1 35 26 A 3 3 0 0 1 35 30" fill="none" stroke="url(#g)" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Circuit arm — upper-left -->
  <polyline points="8,24 3,24 3,20"    stroke="url(#g)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="3"  cy="20" r="1.5" fill="url(#g)"/>
  <!-- Circuit arm — lower-left -->
  <polyline points="8,28 3,28 3,32"    stroke="url(#g)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="3"  cy="32" r="1.5" fill="url(#g)"/>
  <!-- Circuit arm — upper-right -->
  <polyline points="40,24 45,24 45,20" stroke="url(#g)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="45" cy="20" r="1.5" fill="url(#g)"/>
  <!-- Circuit arm — lower-right -->
  <polyline points="40,28 45,28 45,32" stroke="url(#g)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="45" cy="32" r="1.5" fill="url(#g)"/>

  <!-- Bottom fork -->
  <line x1="24" y1="37" x2="24" y2="41" stroke="url(#g)" stroke-width="1.4" stroke-linecap="round"/>
  <polyline points="24,41 19,41 19,45"  stroke="url(#g)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="19" cy="45" r="1.5" fill="url(#g)"/>
  <polyline points="24,41 29,41 29,45"  stroke="url(#g)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="29" cy="45" r="1.5" fill="url(#g)"/>
</svg>
