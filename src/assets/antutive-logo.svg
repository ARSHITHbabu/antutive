<svg width="400" height="400" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lg" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#64B5F6"/>
      <stop offset="55%"  stop-color="#90CAF9"/>
      <stop offset="100%" stop-color="#CE93D8"/>
    </linearGradient>
  </defs>

  <!-- Hexagonal frame -->
  <polygon
    points="20,6 32,13 32,27 20,34 8,27 8,13"
    fill="none"
    stroke="url(#lg)"
    stroke-width="1.8"
    stroke-linejoin="round"
  />

  <!-- Circuit arm — top vertex -->
  <line x1="20" y1="6" x2="20" y2="2" stroke="url(#lg)" stroke-width="1.4" stroke-linecap="round"/>
  <circle cx="20" cy="2" r="1.5" fill="url(#lg)"/>

  <!-- Circuit arm — bottom-left vertex, L-shape -->
  <polyline points="8,27 3,27 3,23" stroke="url(#lg)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="3" cy="23" r="1.5" fill="url(#lg)"/>

  <!-- Circuit arm — bottom-right vertex, L-shape -->
  <polyline points="32,27 37,27 37,23" stroke="url(#lg)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="37" cy="23" r="1.5" fill="url(#lg)"/>

  <!-- A letterform — left leg -->
  <line x1="20" y1="11" x2="14" y2="29" stroke="url(#lg)" stroke-width="2.9" stroke-linecap="round"/>
  <!-- A letterform — right leg -->
  <line x1="20" y1="11" x2="26" y2="29" stroke="url(#lg)" stroke-width="2.9" stroke-linecap="round"/>
  <!-- A letterform — crossbar -->
  <line x1="16.5" y1="22" x2="23.5" y2="22" stroke="url(#lg)" stroke-width="2.3" stroke-linecap="round"/>

  <!-- Circuit nodes at A structural points -->
  <circle cx="20"   cy="11" r="1.9" fill="url(#lg)"/>
  <circle cx="16.5" cy="22" r="1.1" fill="url(#lg)" opacity="0.8"/>
  <circle cx="23.5" cy="22" r="1.1" fill="url(#lg)" opacity="0.8"/>
</svg>
